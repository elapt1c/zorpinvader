[package]
name = "zorpinvader"
version = "1.0.0"
edition = "2021"
description = "Internet-scale port scanner with API key detection"
license = "AGPL-3.0"

[[bin]]
name = "zorpinvader"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["net", "ioctl", "fs", "process", "signal", "time", "sched"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
crossbeam-queue = "0.3"
parking_lot = "0.12"
once_cell = "1"
base64 = "0.22"
quick-xml = "0.37"
pcap = "2"
ctrlc = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
